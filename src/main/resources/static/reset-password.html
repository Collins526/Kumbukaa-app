<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Kumbukaa</title>
    <style>
        body { font-family: Inter, Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 2rem; }
        .card { max-width: 480px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        input { width: 100%; padding: 0.85rem; margin-top: 0.5rem; margin-bottom: 1rem; border: 1px solid #d0d7de; border-radius: 10px; }
        button { width: 100%; padding: 0.9rem; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .hint { font-size: 0.9rem; color: #64748b; }
        .error { color: #dc2626; font-size: 0.9rem; }
        .success { color: #15803d; font-size: 0.9rem; }
        .strength { height: 8px; border-radius: 999px; background: #e5e7eb; margin-bottom: 0.75rem; }
        .strength > div { height: 100%; border-radius: 999px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p class="hint">Create a strong new password for your account.</p>
        <input id="newPassword" type="password" placeholder="New password">
        <input id="confirmPassword" type="password" placeholder="Confirm password">
        <div class="strength"><div id="strengthBar" style="width:0%; background:#ef4444;"></div></div>
        <p id="strengthText" class="hint">Password strength: weak</p>
        <button onclick="resetPassword()">Reset Password</button>
        <p id="message" class="hint"></p>
    </div>

    <script>
        function updateStrength() {
            const password = document.getElementById('newPassword').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            let score = 0;
            if (password.length >= 8) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[a-z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;
            const widths = [20, 40, 60, 80, 100];
            const colors = ['#ef4444', '#f59e0b', '#eab308', '#84cc16', '#16a34a'];
            const labels = ['weak', 'fair', 'good', 'strong', 'very strong'];
            const index = Math.min(labels.length - 1, Math.max(0, score - 1));
            bar.style.width = `${widths[index]}%`;
            bar.style.background = colors[index];
            text.textContent = `Password strength: ${labels[index]}`;
        }
        document.getElementById('newPassword').addEventListener('input', updateStrength);

        async function resetPassword() {
            const resetToken = sessionStorage.getItem('resetToken');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('message');
            if (newPassword.length < 8) {
                msg.className = 'error';
                msg.textContent = 'Password must be at least 8 characters.';
                return;
            }
            if (!/[A-Z]/.test(newPassword) || !/[a-z]/.test(newPassword) || !/[0-9]/.test(newPassword) || !/[^A-Za-z0-9]/.test(newPassword)) {
                msg.className = 'error';
                msg.textContent = 'Password must include uppercase, lowercase, number, and special character.';
                return;
            }
            if (newPassword !== confirmPassword) {
                msg.className = 'error';
                msg.textContent = 'Passwords do not match.';
                return;
            }
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resetToken, newPassword, confirmPassword })
                });
                const data = await response.json();
                msg.textContent = data.message || 'Password reset successfully.';
                msg.className = response.ok ? 'success' : 'error';
            } catch (error) {
                msg.textContent = 'Unable to reset password.';
                msg.className = 'error';
            }
        }
    </script>
</body>
</html>
