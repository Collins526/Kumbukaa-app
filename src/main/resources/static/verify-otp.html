<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Kumbukaa</title>
    <style>
        body { font-family: Inter, Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 2rem; }
        .card { max-width: 480px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        input { width: 100%; padding: 0.85rem; margin-top: 0.5rem; margin-bottom: 1rem; border: 1px solid #d0d7de; border-radius: 10px; }
        button { width: 100%; padding: 0.9rem; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 0.75rem; }
        .hint { font-size: 0.9rem; color: #64748b; }
        .error { color: #dc2626; font-size: 0.9rem; }
        .success { color: #15803d; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Verify OTP</h2>
        <p class="hint">Enter the 6-digit code sent to your email.</p>
        <input id="email" type="email" placeholder="user@example.com">
        <input id="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456">
        <button onclick="verifyOtp()">Verify</button>
        <button onclick="window.location.href='/forgot-password.html'">Resend OTP</button>
        <p id="message" class="hint"></p>
    </div>

    <script>
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        async function verifyOtp() {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const msg = document.getElementById('message');
            if (!validateEmail(email)) {
                msg.className = 'error';
                msg.textContent = 'Please enter a valid email address.';
                return;
            }
            if (!/^\d{6}$/.test(otp)) {
                msg.className = 'error';
                msg.textContent = 'Please enter the 6-digit verification code.';
                return;
            }
            msg.className = 'hint';
            msg.textContent = 'Please wait...';
            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const data = await response.json();
                msg.textContent = data.message || 'OTP verified successfully.';
                msg.className = response.ok ? 'success' : 'error';
                if (response.ok && data.resetToken) {
                    sessionStorage.setItem('resetToken', data.resetToken);
                    window.location.href = '/reset-password.html';
                }
            } catch (error) {
                msg.textContent = 'Unable to verify OTP.';
                msg.className = 'error';
            }
        }
    </script>
</body>
</html>
