<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Kumbukaa</title>
    <style>
        body { font-family: Inter, Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 2rem; }
        .card { max-width: 480px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        input { width: 100%; padding: 0.85rem; margin-top: 0.5rem; margin-bottom: 1rem; border: 1px solid #d0d7de; border-radius: 10px; }
        button { width: 100%; padding: 0.9rem; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .hint { font-size: 0.9rem; color: #64748b; }
        .error { color: #dc2626; font-size: 0.9rem; }
        .success { color: #15803d; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Forgot Password</h2>
        <p class="hint">Enter your email to receive a one-time verification code.</p>
        <input id="email" type="email" placeholder="user@example.com">
        <button onclick="sendOtp()">Send OTP</button>
        <p id="message" class="hint"></p>
        <p><a href="/index.html">Back to login</a></p>
    </div>

    <script>
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        async function sendOtp() {
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('message');
            if (!validateEmail(email)) {
                msg.className = 'error';
                msg.textContent = 'Please enter a valid email address.';
                return;
            }
            msg.className = 'hint';
            msg.textContent = 'Please wait...';
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                msg.textContent = data.message || 'a verification code has been sent';
                msg.className = response.ok ? 'success' : 'error';
            } catch (error) {
                msg.textContent = 'Unable to submit request.';
                msg.className = 'error';
            }
        }
    </script>
</body>
</html>
